kind = "web"
previewPath = "/"
title = "Lezgo"
description = "People-first Istanbul meetups with multilingual discovery, private and paid host-approved events, invite links, member group chats, and cancellation notifications."
version = "1.0.0"
id = "artifacts/pulsemap"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24970

[services.development]
run = "pnpm --filter @workspace/pulsemap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pulsemap", "run", "build" ]
serve = "static"
publicDir = "artifacts/pulsemap/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24970"
BASE_PATH = "/"
